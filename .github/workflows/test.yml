name: Python Tests & CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Monorepo Packages
        run: |
          uv pip install --system -e "packages/contracts"
          uv pip install --system -e "packages/orgni-ontology"
          uv pip install --system pytest

      - name: Run Pytest
        run: |
          python -m pytest packages/orgni-ontology/tests/