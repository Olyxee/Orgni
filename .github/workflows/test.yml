name: Python Tests & CI Validation

on:
  push:
    branches: [ main, master, feature/clean-ontology-pr ]
  pull_request:
    branches: [ main, master, feature/clean-ontology-pr ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install Monorepo Packages
        run: |
          uv pip install --system -e "packages/contracts"
          uv pip install --system -e "packages/orgni-ontology"
          uv pip install --system pytest

      - name: Run Pytest
        run: |
          python -m pytest packages/orgni-ontology/tests/