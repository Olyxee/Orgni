name: Build and deploy Orgni API to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @workspace/api run build

      - name: Create deployment bundle
        run: |
          rm -rf deploy
          pnpm --filter @workspace/api deploy --prod --legacy deploy

      - name: Debug deployment bundle
        run: |
          echo "===== deploy/node_modules ====="
          find deploy/node_modules -maxdepth 2 -type d | sort

          echo ""
          echo "===== Checking lowdb dependencies ====="
          test -d deploy/node_modules/lodash && echo "lodash: FOUND" || echo "lodash: MISSING"
          test -d deploy/node_modules/is-promise && echo "is-promise: FOUND" || echo "is-promise: MISSING"
          test -d deploy/node_modules/graceful-fs && echo "graceful-fs: FOUND" || echo "graceful-fs: MISSING"
          test -d deploy/node_modules/pify && echo "pify: FOUND" || echo "pify: MISSING"
          test -d deploy/node_modules/steno && echo "steno: FOUND" || echo "steno: MISSING"
            - name: Upload deployment artifact
              uses: actions/upload-artifact@v4
              with:
                name: api
                path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: api

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: orgni-api
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4C07297983BC4515AB70D1B36633CDE0 }}