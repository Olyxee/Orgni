[project]
name = "orgni-ontology"
version = "1.0.0"
description = "Orgni Organizational Ontology — Phase 1 (Invoice, Contract, Proof of Payment)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0",
    "anyio==4.12.1",
    "Faker==40.15.0",
    "langsmith==0.7.3",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology*"]