[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "1.0.0"
description = "Canonical token contracts for Orgni Ontology"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0"
]

[tool.setuptools.packages.find]
where = ["."]