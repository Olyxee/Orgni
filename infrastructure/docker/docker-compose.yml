# Local full-platform stack: API + worker + PostgreSQL + Redis.
# Run from the repo root:
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# The web service is dev-only (Vite dev server) — in production the frontend
# is a static build on Vercel, never a container.

services:
  web:
    image: node:24-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @workspace/web run dev"
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ../..:/repo
      - web-node-modules:/repo/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orgni
      POSTGRES_PASSWORD: orgni_dev_password # local-only; never used in cloud environments
      POSTGRES_DB: orgni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://orgni:orgni_dev_password@postgres:5432/orgni
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://orgni:orgni_dev_password@postgres:5432/orgni
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  web-node-modules:
